<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="14" fill="#1a5c2a"/>
  <!-- Tractor wheel shape -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#f5a623" stroke-width="3"/>
  <!-- Wheat/plant stem -->
  <line x1="32" y1="50" x2="32" y2="18" stroke="#f5a623" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Wheat grains left -->
  <ellipse cx="25" cy="26" rx="5" ry="3" fill="#f5a623" transform="rotate(-30 25 26)"/>
  <ellipse cx="23" cy="33" rx="5" ry="3" fill="#f5a623" transform="rotate(-40 23 33)"/>
  <!-- Wheat grains right -->
  <ellipse cx="39" cy="26" rx="5" ry="3" fill="#f5a623" transform="rotate(30 39 26)"/>
  <ellipse cx="41" cy="33" rx="5" ry="3" fill="#f5a623" transform="rotate(40 41 33)"/>
  <!-- Top grain -->
  <ellipse cx="32" cy="20" rx="4" ry="6" fill="#f5a623"/>
  <!-- Bottom PA letters -->
  <text x="32" y="54" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="white" text-anchor="middle">PA</text>
</svg>
